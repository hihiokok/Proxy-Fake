# ==============================================================================
# Enterprise Reverse Proxy & TLS Gateway Configuration
# Protocols: TLS 1.2, TLS 1.3 only (Strictly blocks SSLv2, SSLv3, TLS 1.0, 1.1)
# Features: HSTS, Connection Pooling, Keep-Alive, TCP Proxying, IP ACLs
# ==============================================================================

user vpsuser vpsgroup;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    reset_timedout_connection on;

    # Hardened TLS Settings (Requirement 8)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Certificates from Internal Intermediate CA
    ssl_certificate /opt/vps/ca-vault/server-leaf.crt;
    ssl_certificate_key /opt/vps/ca-vault/server-leaf.key;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=proxy_limit:20m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=addr_limit:20m;

    # Upstream to Control Center
    upstream control_center_upstream {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        limit_req zone=proxy_limit burst=50 nodelay;
        limit_conn addr_limit 50;

        location / {
            proxy_pass http://control_center_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
    }
}
